<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qin Fullstack MVP</title>
</head>
<body>
  <div id="app"></div>
  <section style="padding: 24px; font-family: Arial, sans-serif;">
    <h2>Backend API</h2>
    <p>Frontend script is generated to <code>/app.js</code>.</p>
    <pre id="api-data">loading...</pre>
  </section>
  <script type="module" src="/app.js"></script>
  <script>
    fetch("/api/result")
      .then(r => r.json())
      .then(data => {
        document.getElementById("api-data").textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById("api-data").textContent = "error: " + err;
      });
  </script>
</body>
</html>
