<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qin User DB Demo</title>
</head>
<body>
    <div id="app"></div>
    <main class="shell">
        <section class="toolbar">
            <div>
                <p class="eyebrow">Qin single-port fullstack</p>
                <h1>User database</h1>
            </div>
            <button id="refresh" type="button">Refresh</button>
        </section>

        <section id="runtime-badge" class="runtime-badge"></section>

        <section class="status-line">
            <span id="health-dot" class="dot"></span>
            <span id="status">Checking API...</span>
            <span id="db-ready" hidden>PostgreSQL ready</span>
        </section>

        <form id="user-form" class="user-form">
            <label>
                Name
                <input id="name" name="name" autocomplete="name" required>
            </label>
            <button type="submit">Add user</button>
        </form>

        <section class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Created</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="users"></tbody>
            </table>
            <p id="empty" class="empty" hidden>No users yet.</p>
        </section>
    </main>
    <script type="module" src="/app.js"></script>
</body>
</html>
